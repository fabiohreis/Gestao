<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #333;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-top: 10px;
            display: none;
            padding: 10px;
            background: #ffeaea;
            border-radius: 5px;
        }

        .success-message {
            color: #27ae60;
            text-align: center;
            margin-top: 10px;
            display: none;
            padding: 10px;
            background: #eaffea;
            border-radius: 5px;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🔐 Sistema de Login</h1>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuário:</label>
                <input type="text" id="usuario" name="usuario" required placeholder="Digite seu usuário">
            </div>

            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
        </form>

        <div class="loading" id="loading">
            🔄 Processando...
        </div>

        <div class="error-message" id="errorMessage">
            Erro no login. Verifique suas credenciais.
        </div>

        <div class="success-message" id="successMessage">
            Login realizado com sucesso!
        </div>

        <div class="links">
            <a href="#" onclick="esqueciSenha()">Esqueci minha senha</a>
            <span> | </span>
            <a href="#" onclick="criarConta()">Criar conta</a>
        </div>
    </div>

    <script>
        // Aguarda o DOM carregar completamente
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Página carregada - inicializando eventos...');
            
            var loginForm = document.getElementById('loginForm');
            var btnLogin = document.getElementById('btnLogin');
            var loading = document.getElementById('loading');
            var errorMessage = document.getElementById('errorMessage');
            var successMessage = document.getElementById('successMessage');
            
            if (loginForm) {
                loginForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    console.log('Formulário submetido');
                    
                    var usuario = document.getElementById('usuario').value;
                    var password = document.getElementById('password').value;
                    
                    console.log('Usuário:', usuario, 'Senha:', password);
                    
                    if (usuario && password) {
                        // Mostra loading
                        loading.style.display = 'block';
                        errorMessage.style.display = 'none';
                        successMessage.style.display = 'none';
                        btnLogin.disabled = true;
                        
                        console.log('Chamando Google Apps Script...');
                        
                        // Verifica se google.script.run está disponível
                        if (typeof google !== 'undefined' && google.script && google.script.run) {
                            google.script.run
                                .withSuccessHandler(function(result) {
                                    console.log('Sucesso:', result);
                                    loading.style.display = 'none';
                                    successMessage.textContent = result.message || 'Login realizado!';
                                    successMessage.style.display = 'block';
                                    btnLogin.disabled = false;
                                })
                                .withFailureHandler(function(error) {
                                    console.log('Erro:', error);
                                    loading.style.display = 'none';
                                    errorMessage.textContent = 'Erro: ' + error;
                                    errorMessage.style.display = 'block';
                                    btnLogin.disabled = false;
                                })
                                .processLogin(usuario, password);
                        } else {
                            console.log('google.script.run não disponível');
                            loading.style.display = 'none';
                            errorMessage.textContent = 'Erro: Sistema não carregou corretamente. Recarregue a página.';
                            errorMessage.style.display = 'block';
                            btnLogin.disabled = false;
                        }
                    } else {
                        errorMessage.textContent = 'Preencha todos os campos';
                        errorMessage.style.display = 'block';
                    }
                });
            } else {
                console.log('Formulário não encontrado');
            }
        });

        function esqueciSenha() {
            var usuario = document.getElementById('usuario').value;
            if (usuario) {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(function(result) {
                            alert(result.message);
                        })
                        .recoverPassword(usuario);
                } else {
                    alert('Digite seu usuário e tente novamente');
                }
            } else {
                alert('Digite seu usuário primeiro');
            }
        }

        function criarConta() {
            alert('Entre em contato com o administrador para criar uma conta');
        }

        // Debug
        console.log('Script carregado - Google Apps Script disponível:', typeof google !== 'undefined');
    </script>
</body>
</html>
