<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão - Manutenção Industrial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 500px;
        }

        .logo {
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #333;
            font-size: clamp(1.8em, 5vw, 2.5em);
            margin-bottom: 10px;
        }

        .logo p {
            color: #666;
            font-size: clamp(0.9em, 3vw, 1.1em);
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: clamp(1em, 3.5vw, 1.1em);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover, .btn-primary:active {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover, .btn-secondary:active {
            background: #e9ecef;
            transform: translateY(-2px);
        }

        .features {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            text-align: left;
        }

        .feature {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .feature h3 {
            color: #333;
            margin-bottom: 5px;
            font-size: clamp(0.9em, 3vw, 1em);
        }

        .feature p {
            color: #666;
            font-size: clamp(0.8em, 2.5vw, 0.9em);
        }

        /* Media Queries para telas menores */
        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            
            .btn-container {
                gap: 10px;
            }
            
            .btn {
                padding: 12px 15px;
            }
            
            .features {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }

        @media (max-width: 360px) {
            .container {
                padding: 15px 10px;
            }
            
            .logo h1 {
                font-size: 1.6em;
            }
            
            .btn {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🏢 Gestão da Manutenção</h1>
            <p>Bem-vindo ao sistema de Gestão da Manutenção</p>
        </div>

        <div class="btn-container">
            <button class="btn btn-primary" onclick="abrirLogin()">
                🔐 Fazer Login
            </button>
            
            <button class="btn btn-secondary" onclick="sobreSistema()">
                ℹ️ Sobre o Sistema
            </button>
        </div>

        <div class="features">
            <div class="feature">
                <h3>📊 Relatórios</h3>
                <p>Gere relatórios detalhados</p>
            </div>
            <div class="feature">
                <h3>👥 Gestão</h3>
                <p>Gerencie usuários e permissões</p>
            </div>
            <div class="feature">
                <h3>🔒 Seguro</h3>
                <p>Dados protegidos e criptografados</p>
            </div>
        </div>
    </div>

    <script>
        function abrirLogin() {
            // Abre a URL do seu Web App do Google Apps Script
            window.location.href = 'https://script.google.com/macros/s/AKfycbyeutOfCl36qVb3qXT30vfd5Yeo_VVVMcKpazTXaoXZ8FP1xE-i4acEBaNqtz6fuDVDyA/exec';
        }

        function sobreSistema() {
            alert('Sistema desenvolvido para gerenciamento empresarial.\nVersão 1.0');
        }
    </script>
</body>
</html>
