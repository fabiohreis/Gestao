<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Manutenção Industrial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a3a5f 0%, #2c5c8a 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            text-align: center;
        }
        
        .header {
            background: #1a3a5f;
            color: white;
            padding: 25px 20px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .header h2 {
            font-size: 16px;
            font-weight: 500;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .user-info {
            background: #e8f4fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #1a3a5f;
        }
        
        .user-info h3 {
            color: #1a3a5f;
            margin-bottom: 5px;
        }
        
        .user-name {
            font-size: 18px;
            font-weight: 600;
            color: #2c5c8a;
        }
        
        .action-btn {
            background: #1a3a5f;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 10px 5px;
        }
        
        .action-btn:hover {
            background: #2c5c8a;
            transform: translateY(-2px);
        }

        .btn-link {
            background: #1a3a5f;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 10px 5px;
        }

        .btn-link:hover {
            background: #2c5c8a;
            transform: translateY(-2px);
        }

        .btn-close {
            background: #6c757d;
        }
        
        .btn-close:hover {
            background: #5a6268;
        }
        
        .system-info {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
        }

        .info-message {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 5px;
            padding: 10px;
            margin: 15px 0;
            font-size: 14px;
            color: #856404;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Esconder o link real */
        .hidden-link {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MANUTENÇÃO INDUSTRIAL</h1>
            <h2>SISTEMA DE GESTÃO</h2>
        </div>
        
        <div class="content">
            <div class="user-info">
                <h3>Usuário Logado:</h3>
                <div class="user-name" id="currentUser">Carregando...</div>
            </div>

            <div class="info-message">
                <i class="fas fa-info-circle"></i>
                Clique no botão abaixo para abrir a página de teste em uma nova aba.
            </div>
            
            <div class="button-group">
                <!-- LINK REAL que funciona no iOS -->
                <a id="testPageLink" href="#" target="_blank" class="btn-link">
                    <i class="fas fa-external-link-alt"></i> Abrir Página de Teste
                </a>
                
                <button class="action-btn btn-close" onclick="closePage()">
                    <i class="fas fa-times"></i> Fechar Esta Página
                </button>
            </div>
            
            <div class="system-info">
                <p><strong>Sistema de Gestão v2.1.4</strong> | Status: <span style="color: #28a745;">● ONLINE</span></p>
            </div>
        </div>
    </div>

    <script>
        // Obter parâmetro da URL
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        // Carregar informações do usuário
        function loadUserInfo() {
            const usuario = getUrlParameter('usuario');
            const setor = getUrlParameter('setor');
            
            if (usuario) {
                const userDisplay = document.getElementById('currentUser');
                const decodedUser = decodeURIComponent(usuario);
                const decodedSetor = setor ? decodeURIComponent(setor) : 'Não definido';
                
                // NOVO: Exibir usuário e setor
                userDisplay.textContent = `${decodedUser} (${decodedSetor})`;
                
                // Configurar o link com o usuário E setor
                const testPageLink = document.getElementById('testPageLink');
                testPageLink.href = `teste.html?usuario=${usuario}&setor=${setor}`;
            }
        }

        // Função para tentar fechar a página
        function closePage() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                alert('Por favor, feche esta aba manualmente.');
            }
        }
        
        // Inicializar a página
        document.addEventListener('DOMContentLoaded', loadUserInfo);
    </script>
</body>
</html>
