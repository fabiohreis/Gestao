<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Manutenção Industrial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a3a5f 0%, #2c5c8a 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            text-align: center;
        }
        
        .header {
            background: #1a3a5f;
            color: white;
            padding: 25px 20px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .header h2 {
            font-size: 16px;
            font-weight: 500;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .user-info {
            background: #e8f4fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #1a3a5f;
        }
        
        .user-info h3 {
            color: #1a3a5f;
            margin-bottom: 5px;
        }
        
        .user-name {
            font-size: 18px;
            font-weight: 600;
            color: #2c5c8a;
        }
        
        .action-btn {
            background: #1a3a5f;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        
        .action-btn:hover {
            background: #2c5c8a;
            transform: translateY(-2px);
        }
        
        .system-info {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
        }

        /* Modal de confirmação */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-confirm {
            background: #28a745;
            color: white;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MANUTENÇÃO INDUSTRIAL</h1>
            <h2>SISTEMA DE GESTÃO</h2>
        </div>
        
        <div class="content">
            <div class="user-info">
                <h3>Usuário Logado:</h3>
                <div class="user-name" id="currentUser">Carregando...</div>
            </div>
            
            <button class="action-btn" onclick="confirmOpenTestPage()">
                <i class="fas fa-external-link-alt"></i> Abrir Página de Teste
            </button>
            
            <div class="system-info">
                <p><strong>Sistema de Gestão v2.1.4</strong> | Status: <span style="color: #28a745;">● ONLINE</span></p>
            </div>
        </div>
    </div>

    <!-- Modal de confirmação -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3>Confirmar Ação</h3>
            <p>A página atual será fechada e a página de teste será aberta em uma nova aba.</p>
            <p>Deseja continuar?</p>
            <div class="modal-buttons">
                <button class="action-btn btn-confirm" onclick="openTestPage()">
                    Sim, Continuar
                </button>
                <button class="action-btn btn-cancel" onclick="closeModal()">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <script>
        // Obter parâmetro do usuário da URL
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        // Carregar informações do usuário
        function loadUserInfo() {
            const usuario = getUrlParameter('usuario');
            if (usuario) {
                const userDisplay = document.getElementById('currentUser');
                const decodedUser = decodeURIComponent(usuario);
                userDisplay.textContent = decodedUser;
            }
        }

        // Modal functions
        function confirmOpenTestPage() {
            document.getElementById('confirmModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }
        
        // Função para abrir a página teste.html em nova aba e FECHAR a atual
        function openTestPage() {
            const usuario = getUrlParameter('usuario');
            if (usuario) {
                // Abrir em NOVA ABA com o parâmetro do usuário
                const testPageUrl = `teste.html?usuario=${usuario}`;
                const newWindow = window.open(testPageUrl, '_blank');
                
                // Fechar a janela/aba atual APÓS abrir a nova
                if (newWindow) {
                    // Pequeno delay para garantir que a nova aba abriu
                    setTimeout(() => {
                        window.close(); // Fecha a aba atual
                    }, 100);
                } else {
                    // Fallback se a nova janela não abrir
                    alert('Não foi possível abrir a nova página. Verifique se o popup está bloqueado.');
                }
            } else {
                alert('Usuário não identificado!');
            }
        }
        
        // Inicializar a página
        document.addEventListener('DOMContentLoaded', loadUserInfo);

        // Fechar modal clicando fora
        window.onclick = function(event) {
            const modal = document.getElementById('confirmModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
