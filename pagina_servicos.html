<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Manutenção Industrial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a3a5f 0%, #2c5c8a 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            text-align: center;
        }
        
        .header {
            background: #1a3a5f;
            color: white;
            padding: 25px 20px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .header h2 {
            font-size: 16px;
            font-weight: 500;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .user-info {
            background: #e8f4fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #1a3a5f;
            text-align: center;
        }
        
        .user-name {
            font-size: 18px;
            font-weight: 600;
            color: #2c5c8a;
            line-height: 1.4;
        }
        
        .welcome-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #28a745;
            font-weight: 500;
            text-align: center;
        }
        
        .action-btn {
            background: #1a3a5f;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 10px 5px;
            width: 100%;
            justify-content: center;
        }
        
        .action-btn:hover {
            background: #2c5c8a;
            transform: translateY(-2px);
        }

        .btn-link {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 10px 5px;
            width: 100%;
            justify-content: center;
        }

        .btn-link:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn-close {
            background: #dc3545;
        }
        
        .btn-close:hover {
            background: #c82333;
        }
        
        .system-info {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #dee2e6;
        }

        .info-message {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 5px;
            padding: 10px;
            margin: 15px 0;
            font-size: 14px;
            color: #856404;
            text-align: left;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .checkbox-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 15px;
            text-align: left;
            font-size: 14px;
        }

        .checkbox-item input[type="checkbox"] {
            margin-top: 3px;
            transform: scale(1.2);
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .online-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #28a745;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Esconder o link real */
        .hidden-link {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
                border-radius: 10px;
            }
            
            .header {
                padding: 20px 15px;
            }
            
            .header h1 {
                font-size: 22px;
            }
            
            .content {
                padding: 20px;
            }
            
            .action-btn, .btn-link {
                padding: 12px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MANUTENÇÃO INDUSTRIAL</h1>
            <h2>SISTEMA DE GESTÃO</h2>
        </div>
        
        <div class="content">
            <div class="user-info">
                <div class="user-name" id="currentUser">Carregando...</div>
            </div>

            <div class="welcome-message">
                <i class="fas fa-check-circle"></i> Bem vindo de volta!
            </div>

            <div class="checkbox-item">
                <input type="checkbox" id="instructionCheck" checked disabled>
                <label for="instructionCheck">Clique no botão abaixo para abrir a página de teste em uma nova aba.</label>
            </div>
            
            <div class="button-group">
                <!-- LINK REAL que funciona no iOS -->
                <a id="testPageLink" href="#" target="_blank" class="btn-link">
                    <i class="fas fa-external-link-alt"></i> Abrir Dashboard
                </a>
                
                <button class="action-btn btn-close" onclick="closePage()">
                    <i class="fas fa-times"></i> Fechar Esta Página
                </button>
            </div>
            
            <div class="system-info">
                <p><strong>Sistema de Gestão v2.1.4</strong> | Status: 
                    <span class="status-indicator">
                        <span class="online-dot"></span> ONLINE
                    </span>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Obter parâmetro da URL
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        // Carregar informações do usuário
        function loadUserInfo() {
            const usuario = getUrlParameter('usuario');
            const setor = getUrlParameter('setor');
            
            if (usuario) {
                const userDisplay = document.getElementById('currentUser');
                const decodedUser = decodeURIComponent(usuario);
                const decodedSetor = setor ? decodeURIComponent(setor) : 'Não definido';
                
                // Exibir apenas nome e setor, sem "Usuário Logado:" e sem parênteses
                userDisplay.innerHTML = `${decodedUser}<br>${decodedSetor}`;
                
                // Configurar o link com o usuário E setor
                const testPageLink = document.getElementById('testPageLink');
                testPageLink.href = `teste.html?usuario=${usuario}&setor=${setor}`;
            }
        }

        // Função para tentar fechar a página
        function closePage() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                alert('Por favor, feche esta aba manualmente.');
            }
        }
        
        // Inicializar a página
        document.addEventListener('DOMContentLoaded', loadUserInfo);
    </script>
</body>
</html>
