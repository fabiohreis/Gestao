<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Teste</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .user-info {
            background: #f0f8ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #1a3a5f;
        }
    </style>
</head>
<body>
    <h1>Página de Teste</h1>
    
    <div class="user-info">
        <h3>Informações do Usuário:</h3>
        <p><strong>Nome:</strong> <span id="userName">Carregando...</span></p>
        <p><strong>Setor:</strong> <span id="userSetor">Carregando...</span></p>
    </div>

    <p>Esta é uma página de teste para demonstrar o fluxo de informações.</p>

    <script>
        // Obter parâmetro da URL
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Carregar informações do usuário
        function loadUserInfo() {
            const usuario = getUrlParameter('usuario');
            const setor = getUrlParameter('setor');
            
            if (usuario) {
                const decodedUser = decodeURIComponent(usuario);
                const decodedSetor = setor ? decodeURIComponent(setor) : 'Não definido';
                
                document.getElementById('userName').textContent = decodedUser;
                document.getElementById('userSetor').textContent = decodedSetor;
            }
        }

        // Inicializar a página
        document.addEventListener('DOMContentLoaded', loadUserInfo);
    </script>
</body>
</html>
